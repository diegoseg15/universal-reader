[package]
name = "tauri-plugin-library"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-library"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
